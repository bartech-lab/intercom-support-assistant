<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intercom Support Assistant</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="workspace-theme.css">
  <style>
    body { width: 360px; margin: 0; padding: 16px; background: var(--bg); color: var(--ink); }
    .app-header { padding: 12px; gap: 8px; }
    .app-header img { width: 40px; height: 28px; }
    .app-header h1 { font-size: 14px; }
    .destinations { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 16px 0 24px; }
    .destination { padding: 12px; min-height: 40px; border: 1px solid var(--hairline); border-radius: 8px; background: var(--surface); color: var(--ink); cursor: pointer; font-weight: 600; }
    .destination-primary { grid-column: 1 / -1; background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    h2 { font-size: 18px; margin: 0 0 12px; }
    .meta { margin-top: 24px; padding-top: 12px; border-top: 1px solid var(--hairline); color: var(--ink-muted); font-size: 12px; display: flex; justify-content: space-between; }
    .meta a { color: inherit; }
    #popupStatus { color: var(--accent); font-size: 12px; }
    #popupStatus:empty { display: none; }
  </style>
</head>
<body>
  <header class="app-header">
    <img src="icons/isa-logo.svg" alt="">
    <h1>Intercom Support Assistant</h1>
    <button type="button" class="theme-toggle" data-isa-theme-toggle aria-label="Toggle theme"></button>
  </header>
  <nav class="destinations" aria-label="Workspace">
    <button class="destination destination-primary" id="previewBtn" data-section="signatures" type="button">Open signatures</button>
    <button class="destination" data-section="settings" type="button">Settings</button>
    <button class="destination" data-section="tools" type="button">Tools</button>
  </nav>
  <p id="popupStatus" role="status"></p>
  <section aria-labelledby="quickAlertsTitle">
    <h2 id="quickAlertsTitle">Quick alerts</h2>
    <div id="isa-alert-settings" data-isa-compact="true"></div>
  </section>
  <footer class="meta"><span>v1.0.0.0</span><a href="https://github.com/bartech-lab/intercom-support-assistant" target="_blank" rel="noopener noreferrer">Source</a></footer>
  <script src="signatures-data.js"></script>
  <script src="alert-settings-ui.js"></script>
  <script src="popup.js"></script>
</body>
</html>
